<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Prestamos App</title>
<meta name="theme-color" content="#01696f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --primary:#01696f; --primary-dark:#0c4e54; --primary-light:#e0f2f1;
    --bg:#f1f5f9; --surface:#fff; --surface2:#f8fafc;
    --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
    --success:#10b981; --danger:#ef4444;
    --radius:16px; --radius-sm:10px;
    --shadow:0 4px 20px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  /* TOPBAR */
  .topbar{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.01em}
  .brand-logo{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:10px;display:grid;place-items:center;font-size:18px}
  .topbar-actions{display:flex;gap:8px}
  .icon-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .icon-btn:active{opacity:.7}
  /* CONTENT */
  .content{flex:1;padding:12px 12px 80px;overflow-y:auto}
  .screen{display:none}
  .screen.active{display:block}
  /* CARDS / ITEMS */
  .item{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .item-name{font-size:17px;font-weight:700;margin-bottom:3px}
  .item-sub{color:var(--muted);font-size:13px}
  .item-actions{display:flex;gap:6px;flex-shrink:0}
  .item-btn{background:var(--surface2);border:1px solid var(--border);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px;display:grid;place-items:center;flex-shrink:0}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(16,185,129,.18);flex-shrink:0;margin-top:4px}
  /* STATS */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .stat.full{grid-column:1/-1}
  .stat-lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .stat-val{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .stat-val.green{color:#059669}
  .stat-val.orange{color:#d97706}
  /* SECTION TITLE */
  .sec-title{font-size:17px;font-weight:800;margin-bottom:10px;color:var(--primary-dark)}
  /* SEARCH */
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap input{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);padding:0 14px 0 38px;font-size:15px;background:var(--surface)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
  /* FAB */
  .fab{position:fixed;bottom:76px;right:calc(max(0px,(100vw - 430px)/2) + 16px);width:58px;height:58px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:32px;box-shadow:0 8px 24px rgba(1,105,111,.4);cursor:pointer;z-index:25}
  .fab:active{transform:scale(.95)}
  /* BOTTOM NAV */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);background:var(--primary);display:grid;grid-template-columns:repeat(3,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .nav-btn{background:transparent;border:none;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .nav-btn.active{color:#fff}
  .nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* EMPTY */
  .empty{text-align:center;padding:32px 16px;color:var(--muted);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
  .empty-icon{font-size:36px;margin-bottom:8px}
  .empty p{font-size:14px}
  /* MODAL */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{width:min(430px,100vw);max-height:90dvh;background:#fff;border-radius:22px 22px 0 0;overflow-y:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .drag-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px}
  .sheet-title{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--primary-dark)}
  /* FORM */
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .form-group input,.form-group select,.form-group textarea{width:100%;height:48px;border:1.5px solid var(--border);border-radius:11px;padding:0 12px;font-size:15px;background:var(--surface);color:var(--text);transition:border-color .15s}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
  .form-group input[readonly]{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .form-hint{font-size:12px;color:var(--muted);margin-top:4px}
  .form-actions{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;height:48px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{background:var(--primary-dark)}
  .btn-cancel{background:var(--border);color:var(--text)}
  /* CLIENTS TABS */
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* BADGE */
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
  .badge-diario{background:#fef9c3;color:#854d0e}
  .badge-semanal{background:#dcfce7;color:#166534}
  .badge-quincenal{background:#dbeafe;color:#1e40af}
  .badge-mensual{background:#f3e8ff;color:#6b21a8}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">💵</div>
      FINANZAS
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="refresh()" title="Actualizar">↻</button>
    </div>
  </header>

  <main class="content">
    <!-- FINANZAS -->
    <section id="screen-finanzas" class="screen active">
      <div class="sec-title">Resumen general</div>
      <div id="statsGrid" class="stats-grid"></div>
    </section>

    <!-- PRÉSTAMOS -->
    <section id="screen-prestamos" class="screen">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchLoans" placeholder="Buscar préstamo..." oninput="renderLoans()"/>
      </div>
      <div id="loansList"></div>
    </section>

    <!-- PAGOS -->
    <section id="screen-pagos" class="screen">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchPayments" placeholder="Buscar pago..." oninput="renderPayments()"/>
      </div>
      <div id="paymentsList"></div>
    </section>

    <!-- CLIENTES -->
    <section id="screen-clientes" class="screen">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchClients" placeholder="Buscar cliente..." oninput="renderClients()"/>
      </div>
      <div id="clientsList"></div>
    </section>
  </main>

  <button id="fab" class="fab" onclick="openFab()">＋</button>

  <nav class="nav">
    <button class="nav-btn" data-tab="pagos" onclick="goTab('pagos')">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>PAGOS
    </button>
    <button class="nav-btn" data-tab="prestamos" onclick="goTab('prestamos')">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/></svg>PRÉSTAMOS
    </button>
    <button class="nav-btn active" data-tab="finanzas" onclick="goTab('finanzas')">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>FINANZAS
    </button>
    <button class="nav-btn" data-tab="clientes" onclick="goTab('clientes')">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>CLIENTES
    </button>
  </nav>
</div>

<!-- MODAL: PRÉSTAMO -->
<div id="loanModal" class="modal">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sheet-title" id="loanModalTitle">Nuevo Préstamo</div>
    <form id="loanForm" onsubmit="saveLoan(event)">
      <input type="hidden" id="loanId"/>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="lFecha" required/>
      </div>
      <div class="form-group">
        <label>Cliente</label>
        <select id="lCliente" required>
          <option value="">Seleccionar cliente...</option>
        </select>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Importe</label>
          <input type="number" id="lImporte" min="0" step="1000" required oninput="recalc()"/>
        </div>
        <div class="form-group">
          <label>Interés %</label>
          <input type="number" id="lInteres" min="0" step="0.1" value="0" required oninput="recalc()"/>
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Modalidad</label>
          <select id="lModalidad" required>
            <option value="DIARIO">DIARIO</option>
            <option value="SEMANAL" selected>SEMANAL</option>
            <option value="QUINCENAL">QUINCENAL</option>
            <option value="MENSUAL">MENSUAL</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cuotas</label>
          <input type="number" id="lCuotas" min="1" step="1" required oninput="recalc()"/>
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Importe Total</label>
          <input type="number" id="lImporteTotal" readonly/>
        </div>
        <div class="form-group">
          <label>Cuota</label>
          <input type="number" id="lCuota" readonly/>
          <div class="form-hint">Redondeada al millar</div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeLoanModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: PAGO -->
<div id="paymentModal" class="modal">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sheet-title">Registrar Pago</div>
    <form id="paymentForm" onsubmit="savePayment(event)">
      <input type="hidden" id="paymentId"/>
      <div class="form-group">
        <label>Préstamo</label>
        <select id="pLoanId" required></select>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="pFecha" required/>
        </div>
        <div class="form-group">
          <label>Monto</label>
          <input type="number" id="pMonto" min="0" step="1000" required/>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closePaymentModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Pago</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: CLIENTE -->
<div id="clientModal" class="modal">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sheet-title" id="clientModalTitle">Nuevo Cliente</div>
    <form id="clientForm" onsubmit="saveClient(event)">
      <input type="hidden" id="clientId"/>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="cNombre" required placeholder="Nombre del cliente"/>
      </div>
      <div class="form-group">
        <label>Identificación</label>
        <input type="text" id="cIdentificacion" placeholder="CC / NIT"/>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="cTelefono" placeholder="3001234567"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="cEmail" placeholder="correo@email.com"/>
        </div>
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="cDireccion" placeholder="Dirección"/>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeClientModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
      </div>
    </form>
  </div>
</div>

<script>
// ---- CONFIG SUPABASE ----
const SUPABASE_URL = 'https://xxvzfajudcqdwehfhkjn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4dnpmYWp1ZGNxZHdlaGZoa2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzAwMDgsImV4cCI6MjA5Mzc0NjAwOH0.CfTzLor2xiSdVGvwv9M6DGelXpUYsi_kyhfYs2n-n9w';
const sbReady = SUPABASE_URL !== 'TU_SUPABASE_URL';
const sb = sbReady ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ---- STATE ----
let loans = [], payments = [], clients = [], currentTab = 'finanzas';

// ---- NAVIGATION ----
function goTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const fab = document.getElementById('fab');
  fab.style.display = tab === 'finanzas' ? 'none' : 'flex';
}

function openFab() {
  if (currentTab === 'prestamos') openLoanModal();
  else if (currentTab === 'pagos') openPaymentModal();
  else if (currentTab === 'clientes') openClientModal();
}

// ---- DATA LOAD ----
async function loadData() {
  if (!sbReady) {
    clients = [
      {id:1, nombre:'José Fernando Mecanico', identificacion:'12345678', telefono:'3001234567', email:'jose@mail.com', direccion:'Cali'},
      {id:2, nombre:'David Mecanico', identificacion:'87654321', telefono:'3109876543', email:'david@mail.com', direccion:'Cali'},
      {id:3, nombre:'Diego Fernando Lozano', identificacion:'11111111', telefono:'3201111111', email:'diego@mail.com', direccion:'Cali'},
      {id:4, nombre:'Natalia Lozano Rebolledo', identificacion:'22222222', telefono:'3152222222', email:'natalia@mail.com', direccion:'Cali'},
      {id:5, nombre:'Brandon Steven', identificacion:'33333333', telefono:'3183333333', email:'brandon@mail.com', direccion:'Cali'},
    ];
    loans = [
      {id:1, fecha:'2026-04-11', cliente_id:1, importe:2000000, interes:20, modalidad:'SEMANAL', cuotas:10, importe_total:2400000, cuota:240000},
      {id:2, fecha:'2026-05-04', cliente_id:2, importe:1500000, interes:18, modalidad:'QUINCENAL', cuotas:8, importe_total:1770000, cuota:221000},
      {id:3, fecha:'2026-01-20', cliente_id:3, importe:800000, interes:15, modalidad:'MENSUAL', cuotas:5, importe_total:920000, cuota:184000},
    ];
    payments = [
      {id:1, loan_id:1, fecha:'2026-02-26', monto:240000},
      {id:2, loan_id:1, fecha:'2026-03-05', monto:240000},
      {id:3, loan_id:1, fecha:'2026-03-12', monto:240000},
      {id:4, loan_id:2, fecha:'2026-04-22', monto:221000},
    ];
    renderAll(); return;
  }
  const [{ data: c }, { data: l }, { data: p }] = await Promise.all([
    sb.from('clientes').select('*').order('nombre'),
    sb.from('prestamos').select('*').order('fecha', { ascending: false }),
    sb.from('pagos').select('*').order('fecha', { ascending: false }),
  ]);
  clients = c || []; loans = l || []; payments = p || [];
  renderAll();
}

async function refresh() { await loadData(); }

// ---- RENDER ----
function fmt(v) {
  return new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(v || 0);
}

function clientName(id) {
  const c = clients.find(c => c.id == id);
  return c ? c.nombre : 'Cliente desconocido';
}

function loanLabel(loan) {
  return clientName(loan.cliente_id) + ' · ' + fmt(loan.cuota) + ' x' + loan.cuotas;
}

function renderAll() { renderStats(); renderLoans(); renderPayments(); renderClients(); }

function renderStats() {
  const totalPrestado = loans.reduce((s,l) => s + Number(l.importe), 0);
  const totalEsperado = loans.reduce((s,l) => s + Number(l.cuota) * Number(l.cuotas), 0);
  const totalPagado = payments.reduce((s,p) => s + Number(p.monto), 0);
  const ganancias = totalEsperado - totalPrestado;
  const pendiente = totalEsperado - totalPagado;
  const capitalInicial = 2000000;
  const capitalDisponible = capitalInicial - totalPrestado + totalPagado;

  document.getElementById('statsGrid').innerHTML = [
    ['Capital Inicial', capitalInicial, ''],
    ['Capital Disponible', capitalDisponible, ''],
    ['Total Prestado', totalPrestado, ''],
    ['Total Pagado', totalPagado, 'green'],
    ['Ganancias Totales', ganancias, 'green'],
    ['Pendiente por Cobrar', pendiente, 'orange'],
  ].map(([lbl, val, cls], i) => `
    <div class="stat${i < 2 ? ' full' : ''}">
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-val ${cls}">${fmt(val)}</div>
    </div>`).join('');
}

function renderLoans() {
  const q = (document.getElementById('searchLoans')?.value || '').toLowerCase();
  const filtered = loans.filter(l => clientName(l.cliente_id).toLowerCase().includes(q));
  const el = document.getElementById('loansList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">💸</div><p>No hay préstamos</p></div>'; return;
  }
  el.innerHTML = filtered.map(l => {
    const pagadoL = payments.filter(p => p.loan_id == l.id).reduce((s,p) => s + Number(p.monto), 0);
    const totalL = Number(l.cuota) * Number(l.cuotas);
    const pct = totalL > 0 ? Math.min(100, Math.round(pagadoL / totalL * 100)) : 0;
    const mod = l.modalidad?.toLowerCase() || 'semanal';
    return `<div class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${clientName(l.cliente_id)}</div>
          <div class="item-sub">${l.fecha} &nbsp;<span class="badge badge-${mod}">${l.modalidad}</span></div>
          <div class="item-sub" style="margin-top:4px">${fmt(l.cuota)} × ${l.cuotas} cuotas &nbsp;·&nbsp; ${pct}% pagado</div>
        </div>
        <div class="item-actions">
          <button class="item-btn" onclick="deleteLoan(${l.id})" title="Eliminar">🗑️</button>
          <button class="item-btn" onclick='editLoan(${JSON.stringify(l).replace(/'/g,"&apos;")})' title="Editar">✏️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPayments() {
  const q = (document.getElementById('searchPayments')?.value || '').toLowerCase();
  const filtered = payments.filter(p => {
    const ln = loans.find(l => l.id == p.loan_id);
    return !ln || clientName(ln.cliente_id).toLowerCase().includes(q);
  });
  const el = document.getElementById('paymentsList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">💳</div><p>No hay pagos</p></div>'; return;
  }
  el.innerHTML = filtered.map(p => {
    const ln = loans.find(l => l.id == p.loan_id);
    const name = ln ? clientName(ln.cliente_id) : 'Préstamo eliminado';
    return `<div class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${name}</div>
          <div class="item-sub">${p.fecha} &nbsp;·&nbsp; ${fmt(p.monto)}</div>
        </div>
        <div class="item-actions">
          <span class="dot"></span>
          <button class="item-btn" onclick="deletePayment(${p.id})" title="Eliminar">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderClients() {
  const q = (document.getElementById('searchClients')?.value || '').toLowerCase();
  const filtered = clients.filter(c => c.nombre.toLowerCase().includes(q) || (c.identificacion||'').includes(q));
  const el = document.getElementById('clientsList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">👤</div><p>No hay clientes</p></div>'; return;
  }
  el.innerHTML = filtered.map(c => {
    const nLoans = loans.filter(l => l.cliente_id == c.id).length;
    return `<div class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${c.nombre}</div>
          <div class="item-sub">${c.identificacion || 'Sin cédula'} &nbsp;·&nbsp; ${c.telefono || 'Sin teléfono'}</div>
          <div class="item-sub">${nLoans} préstamo${nLoans !== 1 ? 's' : ''}</div>
        </div>
        <div class="item-actions">
          <button class="item-btn" onclick="deleteClient(${c.id})" title="Eliminar">🗑️</button>
          <button class="item-btn" onclick='editClient(${JSON.stringify(c).replace(/'/g,"&apos;")})' title="Editar">✏️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ---- LOAN MODAL ----
function openLoanModal(loan) {
  document.getElementById('loanModalTitle').textContent = loan ? 'Editar Préstamo' : 'Nuevo Préstamo';
  document.getElementById('loanId').value = loan?.id || '';
  document.getElementById('lFecha').value = loan?.fecha || today();
  const sel = document.getElementById('lCliente');
  sel.innerHTML = '<option value="">Seleccionar cliente...</option>' +
    clients.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  sel.value = loan?.cliente_id || '';
  document.getElementById('lImporte').value = loan?.importe || '';
  document.getElementById('lInteres').value = loan?.interes ?? 0;
  document.getElementById('lModalidad').value = loan?.modalidad || 'SEMANAL';
  document.getElementById('lCuotas').value = loan?.cuotas || '';
  recalc(loan);
  document.getElementById('loanModal').classList.add('open');
}
function editLoan(loan) { openLoanModal(loan); }
function closeLoanModal() { document.getElementById('loanModal').classList.remove('open'); }

function recalc(loan) {
  const importe = Number(document.getElementById('lImporte').value || loan?.importe || 0);
  const interes = Number(document.getElementById('lInteres').value ?? loan?.interes ?? 0);
  const cuotas = Number(document.getElementById('lCuotas').value || loan?.cuotas || 0);
  const importeTotal = importe + importe * interes / 100;
  const cuota = cuotas > 0 ? Math.round((importeTotal / cuotas) / 1000) * 1000 : 0;
  document.getElementById('lImporteTotal').value = importeTotal || '';
  document.getElementById('lCuota').value = cuota || '';
}

['lImporte','lInteres','lCuotas'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => recalc());
});

async function saveLoan(e) {
  e.preventDefault();
  const id = document.getElementById('loanId').value;
  const payload = {
    fecha: document.getElementById('lFecha').value,
    cliente_id: Number(document.getElementById('lCliente').value),
    importe: Number(document.getElementById('lImporte').value),
    interes: Number(document.getElementById('lInteres').value),
    modalidad: document.getElementById('lModalidad').value,
    cuotas: Number(document.getElementById('lCuotas').value),
    importe_total: Number(document.getElementById('lImporteTotal').value),
    cuota: Number(document.getElementById('lCuota').value),
  };
  if (sb) {
    if (id) await sb.from('prestamos').update(payload).eq('id', id);
    else await sb.from('prestamos').insert(payload);
    await loadData();
  } else {
    if (id) loans = loans.map(l => l.id == id ? {...l,...payload} : l);
    else loans.unshift({...payload, id: Date.now()});
    renderAll();
  }
  closeLoanModal();
}

async function deleteLoan(id) {
  if (!confirm('¿Eliminar este préstamo?')) return;
  if (sb) { await sb.from('prestamos').delete().eq('id', id); await loadData(); }
  else { loans = loans.filter(l => l.id !== id); payments = payments.filter(p => p.loan_id !== id); renderAll(); }
}

// ---- PAYMENT MODAL ----
function openPaymentModal(loanId) {
  document.getElementById('paymentId').value = '';
  const sel = document.getElementById('pLoanId');
  sel.innerHTML = loans.map(l => `<option value="${l.id}">${clientName(l.cliente_id)} · ${fmt(l.cuota)}×${l.cuotas}</option>`).join('');
  if (loanId) sel.value = loanId;
  document.getElementById('pFecha').value = today();
  document.getElementById('pMonto').value = '';
  if (loanId) {
    const loan = loans.find(l => l.id == loanId);
    if (loan) document.getElementById('pMonto').value = loan.cuota;
  }
  document.getElementById('paymentModal').classList.add('open');
}
function closePaymentModal() { document.getElementById('paymentModal').classList.remove('open'); }

async function savePayment(e) {
  e.preventDefault();
  const id = document.getElementById('paymentId').value;
  const payload = {
    loan_id: Number(document.getElementById('pLoanId').value),
    fecha: document.getElementById('pFecha').value,
    monto: Number(document.getElementById('pMonto').value),
  };
  if (sb) {
    if (id) await sb.from('pagos').update(payload).eq('id', id);
    else await sb.from('pagos').insert(payload);
    await loadData();
  } else {
    payments.unshift({...payload, id: Date.now()});
    renderAll();
  }
  closePaymentModal();
}

async function deletePayment(id) {
  if (!confirm('¿Eliminar este pago?')) return;
  if (sb) { await sb.from('pagos').delete().eq('id', id); await loadData(); }
  else { payments = payments.filter(p => p.id !== id); renderAll(); }
}

// ---- CLIENT MODAL ----
function openClientModal(client) {
  document.getElementById('clientModalTitle').textContent = client ? 'Editar Cliente' : 'Nuevo Cliente';
  document.getElementById('clientId').value = client?.id || '';
  document.getElementById('cNombre').value = client?.nombre || '';
  document.getElementById('cIdentificacion').value = client?.identificacion || '';
  document.getElementById('cTelefono').value = client?.telefono || '';
  document.getElementById('cEmail').value = client?.email || '';
  document.getElementById('cDireccion').value = client?.direccion || '';
  document.getElementById('clientModal').classList.add('open');
}
function editClient(c) { openClientModal(c); }
function closeClientModal() { document.getElementById('clientModal').classList.remove('open'); }

async function saveClient(e) {
  e.preventDefault();
  const id = document.getElementById('clientId').value;
  const payload = {
    nombre: document.getElementById('cNombre').value,
    identificacion: document.getElementById('cIdentificacion').value,
    telefono: document.getElementById('cTelefono').value,
    email: document.getElementById('cEmail').value,
    direccion: document.getElementById('cDireccion').value,
  };
  if (sb) {
    if (id) await sb.from('clientes').update(payload).eq('id', id);
    else await sb.from('clientes').insert(payload);
    await loadData();
  } else {
    if (id) clients = clients.map(c => c.id == id ? {...c,...payload} : c);
    else clients.unshift({...payload, id: Date.now()});
    renderAll();
  }
  closeClientModal();
}

async function deleteClient(id) {
  if (loans.some(l => l.cliente_id == id)) {
    alert('No puedes eliminar un cliente con préstamos activos.'); return;
  }
  if (!confirm('¿Eliminar este cliente?')) return;
  if (sb) { await sb.from('clientes').delete().eq('id', id); await loadData(); }
  else { clients = clients.filter(c => c.id !== id); renderAll(); }
}

// ---- UTILS ----
function today() { return new Date().toISOString().slice(0,10); }

// Close modals on backdrop click
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// Init
goTab('finanzas');
loadData();
</script>
