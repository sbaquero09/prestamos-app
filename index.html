<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Prestamos Pro</title>
<meta name="theme-color" content="#0f766e"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand"><div class="brand-badge">💵</div>Prestamos Pro</div>
      <div class="top-actions">
        <button class="ghost-btn" onclick="openSettings()">⚙️</button>
        <button class="ghost-btn" onclick="loadData()">↻</button>
      </div>
    </div>
    <div class="hero-row">
      <div class="hero-card">
        <div class="hero-label">Capital disponible</div>
        <div id="heroCapital" class="hero-value">$0</div>
      </div>
      <div class="hero-card">
        <div class="hero-label">Cobros próximos</div>
        <div id="heroDue" class="hero-value hero-warn">0</div>
      </div>
    </div>
  </header>

  <main class="content">
    <section id="screen-finanzas" class="screen active">
      <div id="dueAlert"></div>
      <p class="sec-title">Panel financiero</p>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section id="screen-prestamos" class="screen">
      <div class="toolbar"><div class="search-box"><span>🔍</span><input id="searchLoans" placeholder="Buscar préstamo…" oninput="renderLoans()"/></div></div>
      <div id="loanList"></div>
    </section>

    <section id="screen-pagos" class="screen">
      <div id="paymentsAlert"></div>
      <div class="toolbar"><div class="search-box"><span>🔍</span><input id="searchPayments" placeholder="Buscar pago o cliente…" oninput="renderPayments()"/></div></div>
      <div id="paymentList"></div>
    </section>

    <section id="screen-clientes" class="screen">
      <div class="toolbar"><div class="search-box"><span>🔍</span><input id="searchClients" placeholder="Buscar cliente…" oninput="renderClients()"/></div></div>
      <div id="clientList"></div>
    </section>
  </main>

  <button id="fab" class="fab" onclick="primaryAction()"><span>+</span></button>

  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="pagos"     onclick="goTab('pagos')">   <span class="nav-ico">💳</span>PAGOS</button>
    <button class="nav-btn" data-tab="prestamos" onclick="goTab('prestamos')"><span class="nav-ico">💰</span>PRÉSTAMOS</button>
    <button class="nav-btn active" data-tab="finanzas"  onclick="goTab('finanzas')"> <span class="nav-ico">📊</span>FINANZAS</button>
    <button class="nav-btn" data-tab="clientes"  onclick="goTab('clientes')"> <span class="nav-ico">👤</span>CLIENTES</button>
  </nav>
</div>

<!-- MODAL CONFIGURACIÓN -->
<div id="settingsModal" class="modal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Configuración</div><button class="close-btn" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="form-group">
      <label>Capital inicial</label>
      <input id="cfgCapital" class="money-input" type="text" inputmode="numeric" placeholder="2.000.000"/>
      <p class="hint">Edita tu capital base. Se refleja en el panel de finanzas.</p>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal('settingsModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSettings()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL PRÉSTAMO -->
<div id="loanModal" class="modal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div id="loanModalTitle" class="sheet-title">Nuevo préstamo</div><button class="close-btn" onclick="closeModal('loanModal')">✕</button></div>
    <form onsubmit="saveLoan(event)">
      <input id="loanId" type="hidden"/>
      <div class="form-group">
        <label>Fecha</label>
        <input id="loanFecha" type="date" required/>
      </div>
      <div class="form-group">
        <label>Cliente</label>
        <select id="loanCliente" required></select>
        <button type="button" class="inline-btn" onclick="openQuickClient()">＋ Crear nuevo cliente</button>
      </div>
      <div class="row2">
        <div class="form-group"><label>Importe</label><input id="loanImporte" class="money-input" type="text" inputmode="numeric" placeholder="1.000.000" required oninput="calcLoan()"/></div>
        <div class="form-group"><label>Interés %</label><input id="loanInteres" type="number" min="0" step="0.1" placeholder="0" required oninput="calcLoan()"/></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Modalidad</label><select id="loanModalidad" onchange="calcLoan()"><option>DIARIO</option><option selected>SEMANAL</option><option>QUINCENAL</option><option>MENSUAL</option></select></div>
        <div class="form-group"><label>Cuotas</label><input id="loanCuotas" type="number" min="1" step="1" placeholder="10" required oninput="calcLoan()"/></div>
      </div>
      <div class="row2">
        <div class="form-group">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
            <label style="margin:0">Importe total</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:pointer">
              <input type="checkbox" id="toggleManual" onchange="onToggleManual()" style="width:16px;height:16px;cursor:pointer"/>
              Editar manualmente
            </label>
          </div>
          <input id="loanImporteTotal" class="readonly-field money-input" type="text" inputmode="numeric" readonly placeholder="Se calcula automático"/>
        </div>
        <div class="form-group"><label>Cuota</label><input id="loanCuota" class="readonly-field" type="text" readonly/><p class="hint">Redondeada al múltiplo de $1.000.</p></div>
        <div id="loanDesglose" class="loan-desglose" style="display:none"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('loanModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CLIENTE (también se usa desde préstamo) -->
<div id="clientModal" class="modal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div id="clientModalTitle" class="sheet-title">Nuevo cliente</div><button class="close-btn" onclick="closeModal('clientModal')">✕</button></div>
    <form onsubmit="saveClient(event)">
      <input id="clientId" type="hidden"/>
      <input id="clientFromLoan" type="hidden" value="0"/>
      <div class="form-group"><label>Nombre completo</label><input id="clientNombre" type="text" required/></div>
      <div class="form-group"><label>Identificación (CC/NIT)</label><input id="clientIdentificacion" type="text"/></div>
      <div class="row2">
        <div class="form-group"><label>Teléfono</label><input id="clientTelefono" type="tel"/></div>
        <div class="form-group"><label>Email</label><input id="clientEmail" type="email"/></div>
      </div>
      <div class="form-group"><label>Dirección</label><input id="clientDireccion" type="text"/></div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('clientModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cliente</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL PAGO -->
<div id="paymentModal" class="modal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Registrar pago</div><button class="close-btn" onclick="closeModal('paymentModal')">✕</button></div>
    <form onsubmit="savePayment(event)">
      <input id="paymentId" type="hidden"/>
      <div class="form-group">
        <label>Préstamo</label>
        <select id="paymentLoanId" required onchange="fillPaymentInfo()"></select>
      </div>
      <div id="loanInfoBox"></div>
      <div class="row2">
        <div class="form-group"><label>Fecha</label><input id="paymentFecha" type="date" required/></div>
        <div class="form-group"><label>Monto</label><input id="paymentMonto" class="money-input" type="text" inputmode="numeric" placeholder="240.000" required/></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('paymentModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar pago</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
  <!-- ── MODAL CRONOGRAMA ── -->
  <div id="scheduleModal" class="modal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div id="scheduleTitle" class="sheet-title">Cronograma</div>
        <button class="close-btn" onclick="closeModal('scheduleModal')">✕</button>
      </div>
      <div style="overflow-x:auto">
        <table class="schedule-table">
          <thead><tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Estado</th></tr></thead>
          <tbody id="scheduleTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
